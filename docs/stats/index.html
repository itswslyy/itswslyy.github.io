<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Stats">
<meta name="theme-color" content="#07080f">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>My Stats</title>
<style>
:root{
  --bg:#07080f;--glass:rgba(22,26,42,.58);--glass2:rgba(34,40,62,.55);--stroke:rgba(255,255,255,.09);--stroke2:rgba(255,255,255,.16);
  --text:#f4f5fb;--dim:#9aa1b8;--mute:#6b7290;--up:#35e08f;--down:#ff6b7a;
  /* data colours (validated for dark surface + colour-blind separation) */
  --c-instagram:#e1306c;--c-wezla:#c47200;--c-facebook:#3b7ff0;--c-youtube:#f0443a;--c-threads:#1fa88c;
  /* decorative brand gradients */
  --g-instagram:linear-gradient(135deg,#feda75,#fa7e1e 25%,#d62976 55%,#962fbf 80%,#4f5bd5);
  --g-wezla:linear-gradient(135deg,#ffd166,#ff9f0a 45%,#ff5e00);
  --g-facebook:linear-gradient(135deg,#7ad0ff,#3b7ff0 50%,#2546d6);
  --g-youtube:linear-gradient(135deg,#ff8a7a,#ff2d2d 50%,#a3001b);
  --g-threads:linear-gradient(135deg,#7cf5d4,#1fa88c 50%,#0e5e66);
  --g-hero:linear-gradient(135deg,#8b5cf6,#ec4899 45%,#f59e0b);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.tab-num,.num{font-variant-numeric:tabular-nums}

/* ---------- animated background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.42;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.b1{background:radial-gradient(circle,#7c3aed,transparent 65%);top:-30vmax;left:-25vmax}
.b2{background:radial-gradient(circle,#db2777,transparent 65%);top:20vh;right:-35vmax;animation-duration:27s;animation-delay:-6s}
.b3{background:radial-gradient(circle,#0ea5e9,transparent 65%);bottom:-35vmax;left:-10vmax;animation-duration:31s;animation-delay:-12s;opacity:.3}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.12)}100%{transform:translate(-6vmax,10vmax) scale(.95)}}
#stars{position:absolute;inset:0;width:100%;height:100%}
.grain{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1px);background-size:3px 3px}

/* ---------- layout ---------- */
.shell{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 108px)}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px}
.hello{font-size:13px;color:var(--dim);letter-spacing:.02em}
h1{margin:2px 0 0;font-size:30px;letter-spacing:-.035em;font-weight:800}
h1 span{background:var(--g-hero);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 200%;animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);margin-top:4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(53,224,143,.6);animation:ping 2s infinite}
.live.stale i{background:#f5a524;animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(53,224,143,.55)}80%,100%{box-shadow:0 0 0 9px rgba(53,224,143,0)}}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.iconbtn svg{width:20px;height:20px;transition:transform .8s var(--ease)}
.iconbtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec-title h2{margin:0;font-size:19px;letter-spacing:-.02em}
.sec-title small{color:var(--mute);font-size:12px}

/* tilt + glare */
.tilt{transform-style:preserve-3d;transition:transform .5s var(--ease);will-change:transform}
.tilt.active{transition:transform .08s linear}
.glare{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.16),transparent 45%);opacity:0;transition:opacity .4s}
.tilt.active .glare{opacity:1}

/* entrance */
.rv{opacity:0;transform:translateY(22px) scale(.97)}
.page.active .rv{animation:rise .7s var(--ease) forwards;animation-delay:calc(var(--i,0) * 70ms)}
body.settled .page.active .rv{animation:none;opacity:1;transform:none}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- pages ---------- */
.page{display:none}
.page.active{display:block;animation:pagein .45s var(--ease)}
.page.active.from-left{animation-name:pageinL}
@keyframes pagein{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pageinL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

/* ---------- hero orb ---------- */
.hero{padding:22px 18px 18px;text-align:center}
.orb{position:relative;width:236px;height:236px;margin:2px auto 8px;perspective:900px}
.orb .core{position:absolute;inset:44px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),rgba(236,72,153,.35) 28%,rgba(124,58,237,.35) 55%,rgba(14,165,233,.15) 75%,transparent 76%);box-shadow:0 0 60px rgba(168,85,247,.45),inset 0 0 40px rgba(255,255,255,.08);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.rings{position:absolute;inset:0;transform-style:preserve-3d;animation:wobble 14s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotateX(8deg) rotateY(-10deg)}50%{transform:rotateX(-10deg) rotateY(12deg)}}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(255,255,255,.16);transform-style:preserve-3d}
.ring .sat{position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;box-shadow:0 0 14px 3px currentColor;background:currentColor}
.r1{transform:rotateX(72deg) rotateZ(20deg);animation:o1 9s linear infinite}
.r2{transform:rotateY(64deg) rotateX(18deg) rotateZ(140deg);animation:o2 13s linear infinite;inset:12px}
.r3{transform:rotateX(58deg) rotateY(40deg) rotateZ(250deg);animation:o3 17s linear infinite;inset:-10px}
.r4{transform:rotateX(-60deg) rotateY(-30deg) rotateZ(80deg);animation:o4 21s linear infinite;inset:24px}
.r5{transform:rotateX(80deg) rotateY(-18deg) rotateZ(300deg);animation:o5 11s linear infinite;inset:-22px}
@keyframes o1{from{transform:rotateX(72deg) rotateZ(0)}to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes o2{from{transform:rotateY(64deg) rotateX(18deg) rotateZ(0)}to{transform:rotateY(64deg) rotateX(18deg) rotateZ(-360deg)}}
@keyframes o3{from{transform:rotateX(58deg) rotateY(40deg) rotateZ(0)}to{transform:rotateX(58deg) rotateY(40deg) rotateZ(360deg)}}
@keyframes o4{from{transform:rotateX(-60deg) rotateY(-30deg) rotateZ(0)}to{transform:rotateX(-60deg) rotateY(-30deg) rotateZ(360deg)}}
@keyframes o5{from{transform:rotateX(80deg) rotateY(-18deg) rotateZ(0)}to{transform:rotateX(80deg) rotateY(-18deg) rotateZ(-360deg)}}
.orb .center{position:absolute;inset:0;display:grid;place-content:center;transform:translateZ(60px)}
.orb .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.orb .big{font-size:42px;font-weight:800;letter-spacing:-.04em;line-height:1.05;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.07);border:1px solid var(--stroke)}
.chip.up{color:var(--up);background:rgba(53,224,143,.1);border-color:rgba(53,224,143,.25)}
.chip.down{color:var(--down);background:rgba(255,107,122,.1);border-color:rgba(255,107,122,.25)}
.chip.flat{color:var(--dim)}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{padding:14px;border-radius:20px}
.tile .k{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.tile .k i{width:8px;height:8px;border-radius:3px}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.tile .s{font-size:11px;color:var(--mute)}

/* ---------- donut ---------- */
.share{display:flex;gap:16px;align-items:center;padding:16px}
.donut{width:132px;height:132px;flex:none;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.donut circle.seg{fill:none;stroke-width:15;stroke-linecap:butt;transition:stroke-dasharray 1.3s var(--ease),stroke-width .25s}
.donut circle.seg.hi{stroke-width:19}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-size:20px}.donut .mid span{font-size:11px;color:var(--dim)}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.legend button{display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;padding:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.legend b{font-weight:600}

/* ---------- hot post ---------- */
.hot{padding:16px;display:block}
.hot .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:linear-gradient(90deg,#ff7a18,#ff2d55);box-shadow:0 6px 20px rgba(255,64,64,.35)}
.hot .tag .fl{display:inline-block;animation:flick 1.2s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.2) rotate(5deg)}}
.hot .tt{font-size:17px;font-weight:700;margin:10px 0 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hot .meta{color:var(--dim);font-size:13px}
.hot .nums{display:flex;gap:18px;margin-top:12px}
.hot .nums b{display:block;font-size:22px;letter-spacing:-.02em}
.hot .nums span{font-size:11px;color:var(--mute)}
.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.09) 50%,transparent 65%);transform:translateX(-100%);animation:shim 3.8s ease-in-out infinite;pointer-events:none}
@keyframes shim{60%,100%{transform:translateX(100%)}}

/* ---------- account cards ---------- */
.acct{margin-bottom:14px;border-radius:26px}
.acct .band{position:relative;padding:16px 16px 14px;display:flex;align-items:center;gap:14px;cursor:pointer}
.acct .band::before{content:"";position:absolute;inset:0;background:var(--g);opacity:.22}
.acct .logo{width:52px;height:52px;border-radius:17px;background:var(--g);display:grid;place-items:center;flex:none;box-shadow:0 10px 30px -6px var(--c);position:relative;transform:translateZ(30px)}
.acct .logo svg{width:28px;height:28px;fill:#fff}
.acct .who{flex:1;min-width:0;position:relative}
.acct .who b{display:block;font-size:16px}
.acct .who span{display:block;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct .fol{text-align:right;position:relative;transform:translateZ(20px)}
.acct .fol b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
.acct .fol small{font-size:11px;color:var(--dim)}
.acct .chev{width:18px;height:18px;opacity:.5;transition:transform .4s var(--ease);flex:none;position:relative}
.acct.open .chev{transform:rotate(180deg)}
.acct .spark{display:block;width:100%;height:56px}
.acct .err{font-size:12px;color:var(--down);padding:0 16px 12px}
.acct .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.acct.open .more{grid-template-rows:1fr}
.acct .more>div{overflow:hidden}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px 10px}
.trio div{background:rgba(255,255,255,.05);border:1px solid var(--stroke);border-radius:14px;padding:9px 10px;font-size:11px;color:var(--dim)}
.trio b{display:block;font-size:17px;color:var(--text);margin-top:2px}
.plist{padding:0 14px 8px}
.prow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--stroke)}
.prow .t{flex:1;min-width:0;font-size:14px}
.prow .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t small{color:var(--mute);font-size:12px}
.prow .v{text-align:right;font-size:12px;color:var(--dim);white-space:nowrap}
.prow .v b{display:block;color:var(--text);font-size:15px}
.openbtn{display:block;margin:4px 14px 14px;padding:12px;border-radius:14px;text-align:center;font-weight:600;font-size:14px;background:var(--g);box-shadow:0 8px 24px -8px var(--c)}

/* ---------- top posts ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--glass);border:1px solid var(--stroke);color:var(--dim);transition:all .3s var(--ease);display:flex;align-items:center;gap:6px}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip.on{color:#fff;background:var(--g,var(--g-hero));border-color:transparent;box-shadow:0 6px 18px -6px rgba(236,72,153,.6);transform:scale(1.04)}
.rank{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:10px;border-radius:20px}
.rank .no{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:rgba(255,255,255,.06)}
.rank .no.m1{background:linear-gradient(135deg,#ffe58a,#f5a524);color:#3b2600;box-shadow:0 6px 18px -4px rgba(245,165,36,.7)}
.rank .no.m2{background:linear-gradient(135deg,#f1f4fa,#9aa3b5);color:#1c2130}
.rank .no.m3{background:linear-gradient(135deg,#ffc29a,#b8622c);color:#2b1406}
.rank .body{flex:1;min-width:0}
.rank .tt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .sub{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;margin-top:2px}
.rank .sub i{width:7px;height:7px;border-radius:50%}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.06);margin-top:7px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px;width:0;transition:width 1.1s var(--ease)}
.rank .vv{text-align:right;flex:none}
.rank .vv b{display:block;font-size:17px;letter-spacing:-.02em}
.rank .vv small{font-size:11px;color:var(--mute)}

/* ---------- growth ---------- */
.gcard{padding:14px 14px 10px;margin-bottom:14px}
.ghead{display:flex;align-items:center;gap:10px}
.ghead .dot{width:30px;height:30px;border-radius:10px;background:var(--g);display:grid;place-items:center}
.ghead .dot svg{width:17px;height:17px;fill:#fff}
.ghead b{flex:1;font-size:15px}
.ghead .ch{text-align:right;font-size:12px;color:var(--dim)}
.ghead .ch strong{display:block;font-size:17px}
.chart{position:relative;margin-top:8px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:130px;overflow:visible}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease) forwards}
body.settled .chart .line{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .area{opacity:0;animation:fadein 1.2s .4s var(--ease) forwards}
body.settled .chart .area{animation:none;opacity:1}
@keyframes fadein{to{opacity:1}}
.chart .grid line{stroke:rgba(255,255,255,.06);stroke-width:1}
.chart .ax{font-size:10px;fill:var(--mute)}
.xhair{position:absolute;top:0;bottom:18px;width:1px;background:rgba(255,255,255,.35);pointer-events:none;opacity:0}
.xdot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid var(--bg);pointer-events:none;opacity:0}
.tip{position:absolute;top:-6px;transform:translateX(-50%);background:rgba(10,12,22,.92);border:1px solid var(--stroke2);border-radius:10px;padding:5px 9px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0}
.chart.scrub .xhair,.chart.scrub .xdot,.chart.scrub .tip{opacity:1}
.empty{height:110px;border-radius:14px;margin-top:8px;display:grid;place-content:center;text-align:center;font-size:13px;color:var(--mute);background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 12px,transparent 12px 24px)}

.miles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mile{padding:14px;text-align:center;border-radius:22px}
.mring{width:92px;height:92px;margin:2px auto 6px;position:relative}
.mring svg{width:100%;height:100%;transform:rotate(-90deg)}
.mring circle{fill:none;stroke-width:9}
.mring .trk{stroke:rgba(255,255,255,.07)}
.mring .val{stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray 1.4s var(--ease)}
.mring .pc{position:absolute;inset:0;display:grid;place-content:center;font-weight:800;font-size:18px}
.mile b{display:block;font-size:14px}
.mile small{display:block;font-size:11px;color:var(--mute);margin-top:2px}

/* ---------- tab bar ---------- */
nav{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(calc(100% - 32px),420px);height:66px;border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;background:rgba(16,19,32,.72);border:1px solid var(--stroke2);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 20px 50px -10px rgba(0,0,0,.7)}
nav .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:18px;background:var(--g-hero);opacity:.9;box-shadow:0 8px 24px -6px rgba(236,72,153,.7);transition:transform .55s var(--spring)}
nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--dim);transition:color .3s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--spring)}
nav button[aria-selected="true"]{color:#fff}
nav button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.12)}

/* ---------- lock ---------- */
#lock{position:relative;z-index:2;max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 9vh) 22px 40px;text-align:center}
#lock .orb{width:190px;height:190px}
#lock .orb .core{inset:36px}
#lock h1{font-size:34px;margin:14px 0 6px}
#lock p{color:var(--dim);margin:0 0 22px;font-size:14px}
#lock input{width:100%;font:inherit;font-size:17px;padding:16px;border-radius:18px;border:1px solid var(--stroke2);background:rgba(255,255,255,.06);color:var(--text);outline:none;text-align:center;letter-spacing:.06em;transition:border-color .3s,box-shadow .3s}
#lock input:focus{border-color:rgba(236,72,153,.7);box-shadow:0 0 0 4px rgba(236,72,153,.18)}
#lock .go{width:100%;margin-top:12px;padding:16px;border-radius:18px;font-weight:700;background:var(--g-hero);background-size:200% 200%;animation:sheen 5s ease-in-out infinite;box-shadow:0 14px 34px -10px rgba(236,72,153,.8)}
#lock .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--down)}
#lock.shake .card{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.hide{display:none!important}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:18px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><canvas id="stars"></canvas><div class="grain"></div></div>

<div id="lock" class="hide">
  <div class="card">
    <div class="orb" aria-hidden="true"><div class="core"></div>
      <div class="rings"><div class="ring r1" style="color:#e1306c"><i class="sat"></i></div><div class="ring r2" style="color:#ff9f0a"><i class="sat"></i></div><div class="ring r3" style="color:#3b7ff0"><i class="sat"></i></div></div>
    </div>
    <h1>My <span style="background:var(--g-hero);-webkit-background-clip:text;background-clip:text;color:transparent">Stats</span></h1>
    <p>Enter your passphrase. It stays on this phone.</p>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passphrase">
    <button class="go" id="go">Unlock</button>
    <div class="msg" id="lockerr"></div>
  </div>
</div>

<div id="app" class="hide">
  <div class="shell">
    <header>
      <div>
        <div class="hello" id="hello">Hello</div>
        <h1 id="ptitle">Your <span>empire</span></h1>
        <div class="live" id="live"><i></i><span id="upd">Loading…</span></div>
      </div>
      <button class="iconbtn" id="ref" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </header>
    <main id="main">
      <section class="page" id="p-home"></section>
      <section class="page" id="p-accounts"></section>
      <section class="page" id="p-top"></section>
      <section class="page" id="p-growth"></section>
    </main>
    <div class="foot">Live · refreshes every 5 min · swipe to switch tabs</div>
  </div>
  <nav role="tablist" aria-label="Sections">
    <div class="pill" id="pill"></div>
    <button role="tab" data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Home</button>
    <button role="tab" data-tab="accounts" aria-label="Accounts"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.7.8 2.8 2.5 3 5.2"/></svg>Accounts</button>
    <button role="tab" data-tab="top" aria-label="Top posts"><svg viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5 0-6 1-8.5Z"/></svg>Top</button>
    <button role="tab" data-tab="growth" aria-label="Growth"><svg viewBox="0 0 24 24"><path d="M3 17l5.5-5.5 4 4L21 7"/><path d="M15 7h6v6"/></svg>Growth</button>
  </nav>
</div>

<script>
// Live source: Cloudflare worker (refreshes every 5 min). Backup: the older GitHub copy.
const SOURCES = location.hostname.endsWith("github.io")
  ? ["https://wslyy-stats.wslyy.workers.dev/stats.enc", "https://raw.githubusercontent.com/itswslyy/itswslyy.github.io/stats-data/stats.enc"]
  : ["stats.enc"];
const ICON = {
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7.3A4.7 4.7 0 1 0 12 16.7 4.7 4.7 0 0 0 12 7.3Zm0 7.7a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm6-7.9a1.1 1.1 0 1 1-2.2 0 1.1 1.1 0 0 1 2.2 0ZM12 3.6c2.7 0 3 0 4.1.1 2.7.1 4 1.4 4.1 4.1.1 1.1.1 1.4.1 4.1s0 3-.1 4.1c-.1 2.7-1.4 4-4.1 4.1-1.1.1-1.4.1-4.1.1s-3 0-4.1-.1c-2.7-.1-4-1.4-4.1-4.1C3.7 15 3.6 14.7 3.6 12s0-3 .1-4.1C3.8 5.2 5.1 3.9 7.9 3.7 9 3.6 9.3 3.6 12 3.6ZM12 2c-2.7 0-3.1 0-4.1.1C4.2 2.2 2.2 4.2 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.2 3.7 2.2 5.7 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c3.7-.2 5.7-2.2 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.2-3.7-2.2-5.7-5.8-5.8C15.1 2 14.7 2 12 2Z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.5 2.5 0 0 0 1.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8ZM10 15V9l5.2 3L10 15Z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 22 12Z"/></svg>',
  threads:'<svg viewBox="0 0 24 24"><path d="M16.7 11.2c-.1 0-.2-.1-.3-.1-.2-3-1.8-4.7-4.6-4.7-1.7 0-3.1.7-3.9 2l1.5 1c.6-.9 1.6-1.1 2.4-1.1 1 0 1.7.3 2.2.9.3.4.6 1 .7 1.7-.8-.1-1.6-.2-2.5-.1-2.5.1-4.1 1.6-4 3.6.1 1 .6 1.9 1.4 2.4.7.5 1.6.7 2.6.6 1.3-.1 2.3-.6 3-1.4.5-.6.9-1.5 1-2.5.6.4 1.1.9 1.3 1.5.4 1 .4 2.7-1 4.1-1.2 1.2-2.7 1.8-4.9 1.8-2.5 0-4.3-.8-5.5-2.3-1.1-1.4-1.7-3.4-1.7-6s.6-4.6 1.7-6c1.2-1.5 3-2.3 5.5-2.3s4.3.8 5.6 2.3c.6.7 1.1 1.7 1.4 2.8l1.8-.5c-.4-1.4-1-2.6-1.8-3.6C17.3 3.1 15 2 12 2 9 2 6.7 3 5.1 4.9 3.7 6.6 3 9 3 12s.7 5.4 2.1 7.1C6.7 21 9 22 12 22c2.7 0 4.6-.7 6.2-2.3 2.1-2.1 2-4.7 1.3-6.3-.5-1.1-1.5-2-2.8-2.6Zm-4.6 4.4c-1.1.1-2.2-.4-2.3-1.4 0-.8.6-1.6 2.3-1.7h.6c.6 0 1.2.1 1.7.2-.2 2.4-1.3 2.8-2.3 2.9Z"/></svg>'
};
ICON.wezla = ICON.youtube;
const META = {
  instagram:{label:"Instagram",short:"IG"},
  wezla:{label:"wezla",short:"wezla",sub:"YouTube"},
  facebook:{label:"Facebook",short:"FB"},
  youtube:{label:"Relatable",short:"YT",sub:"YouTube"},
  threads:{label:"Threads",short:"Threads"}
};
const ORDER = Object.keys(META);
const TABS = ["home","accounts","top","growth"];
const TITLES = {home:["Your","empire"],accounts:["Your","accounts"],top:["Top","posts"],growth:["Your","growth"]};
const MILESTONES = [100,250,500,1000,2500,5000,10000,25000,50000,100000,250000,500000,1e6,2.5e6,5e6,1e7];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
// The passphrase is also kept in the link's #fragment (never sent to any server), because iPhone home-screen
// apps can lose saved storage between launches. Adding to Home Screen after unlocking bakes it into the icon.
const fromHash = new URLSearchParams(location.hash.slice(1)).get("k");
let pass = fromHash || store.get("stats_pass"), data = null;
let tab = TABS.includes(store.get("stats_tab")) ? store.get("stats_tab") : "home";
let open = new Set(JSON.parse(store.get("stats_open") || "[]"));
let filter = store.get("stats_filter") || "all", range = store.get("stats_range") || "7d";
const shown = {};   // last number shown per counter, so refreshes animate from old to new

const C = k => `var(--c-${k})`, G = k => `var(--g-${k})`;
const fmt = n => n==null ? "–" : n>=1e6 ? (n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,"")+"M" : n>=1e4 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"K" : Math.round(n).toLocaleString("en-GB");
const full = n => n==null ? "–" : Math.round(n).toLocaleString("en-GB");
const ago = t => { const s=Date.now()/1000-t; return s<90?"just now":s<3600?Math.round(s/60)+" min ago":s<86400?Math.round(s/3600)+"h ago":Math.round(s/86400)+"d ago"; };
const when = iso => iso ? ago(Date.parse(iso)/1000) : "";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const cnt = (key, val, f="short") => `<span class="num" data-c="${key}" data-v="${val??""}" data-f="${f}">${val==null?"–":(f==="full"?full:fmt)(shown[key] ?? (reduce ? val : 0))}</span>`;

async function decrypt(box, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(box.salt), iterations:box.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(box.iv)}, key, b64(box.ct))));
}

async function load(){
  $("ref").classList.add("spin"); $("upd").textContent = "Refreshing…";
  try{
    let box = null, lastErr = null;
    for(const src of SOURCES){
      try{
        const r = await fetch(src + "?t=" + Date.now(), {cache:"no-store"});
        if(!r.ok) throw new Error("HTTP " + r.status);
        box = await r.json(); break;
      }catch(e){ lastErr = e; }
    }
    if(!box) throw lastErr;
    data = await decrypt(box, pass);
    store.set("stats_pass", pass);
    if(new URLSearchParams(location.hash.slice(1)).get("k") !== pass) history.replaceState(null, "", "#k=" + encodeURIComponent(pass));
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    store.set("stats_cache", JSON.stringify(data));
    render();
  }catch(e){
    if(e.name === "OperationError"){ store.del("stats_pass"); pass=null; history.replaceState(null, "", location.pathname); showLock("That passphrase didn't work. Check it matches STATS_KEY exactly.", true); return; }
    if(!data){ showLock(/404/.test(e.message) ? "No stats published yet. The first refresh on GitHub hasn't run – try again in a few minutes."
                                              : "Couldn't load stats (" + e.message + "). Check your signal and try again."); return; }
    $("upd").textContent = "Offline · last update " + ago(data.updated); $("live").classList.add("stale");
  }finally{ $("ref").classList.remove("spin"); }
}

/* ---------- data helpers ---------- */
const keys = () => ORDER.filter(k => data.accounts[k] && (data.accounts[k].followers != null || data.accounts[k].error));
function past(k, secs){
  const target = data.updated - secs; let best = null;
  for(const [t,s] of data.history){ if(t <= target && s[k] && s[k].f != null) best = s[k].f; }
  return best;
}
const series = (k, since=0) => data.history.filter(h => h[0] >= since && h[1][k] && h[1][k].f != null).map(h => [h[0], h[1][k].f]);
const allPosts = () => keys().flatMap(k => (data.accounts[k].posts || []).map(p => ({...p, k})));
const score = p => p.views ?? (p.likes || 0) * 10;
function deltaChip(now, then, label="24h"){
  if(now == null || then == null) return `<span class="chip flat">● building ${label} data</span>`;
  const d = now - then, cls = d > 0 ? "up" : d < 0 ? "down" : "flat";
  return `<span class="chip ${cls}">${d>0?"▲":d<0?"▼":"●"} ${d>0?"+":""}${fmt(d)} <span style="opacity:.7;font-weight:500">${label}</span></span>`;
}
function milestone(f){
  const next = MILESTONES.find(m => m > f) || f * 2, prev = [...MILESTONES].reverse().find(m => m <= f) || 0;
  return {next, prev, pct: Math.max(0, Math.min(1, (f - prev) / (next - prev)))};
}
function pace(k){ // followers per day from history
  const s = series(k); if(s.length < 2) return null;
  const [t0,f0] = s[0], [t1,f1] = s[s.length-1]; const days = (t1 - t0) / 86400;
  return days < 0.25 ? null : (f1 - f0) / days;
}

/* ---------- pages ---------- */
function orbHTML(ks){
  const rings = ks.slice(0,5).map((k,i) => `<div class="ring r${i+1}" style="color:${C(k)}"><i class="sat"></i></div>`).join("");
  return `<div class="orb" aria-hidden="true"><div class="core"></div><div class="rings">${rings}</div>
    <div class="center"><div class="lab">Total followers</div><div class="big">${cnt("total", ks.reduce((s,k)=>s+(data.accounts[k].followers||0),0), "full")}</div></div></div>`;
}
function homePage(){
  const A = data.accounts, ks = keys(), total = ks.reduce((s,k)=>s+(A[k].followers||0),0);
  const hasDay = data.history.length && data.history[0][0] <= data.updated - 86400;
  const totalPast = hasDay ? ks.reduce((s,k)=>s+(past(k,86400) ?? A[k].followers ?? 0),0) : null;
  const ig = (A.instagram||{}).today || {};
  const recent = allPosts(), views = recent.reduce((s,p)=>s+(p.views||0),0), likes = recent.reduce((s,p)=>s+(p.likes||0),0);
  const fresh = recent.filter(p => p.ts && Date.now() - Date.parse(p.ts) < 48*3600e3).sort((a,b)=>score(b)-score(a))[0] || recent.sort((a,b)=>score(b)-score(a))[0];
  const withF = ks.filter(k => A[k].followers);
  // donut
  let off = 0; const segs = withF.map(k => { const pct = A[k].followers / total * 100; const s = {k, pct, off}; off += pct; return s; });
  const gap = segs.length > 1 ? 0.6 : 0;
  const donut = segs.map(s => `<circle class="seg" data-k="${s.k}" cx="50" cy="50" r="40" pathLength="100" stroke="${C(s.k)}" stroke-dasharray="0 100" data-d="${Math.max(0.01, s.pct - gap)} ${100 - Math.max(0.01, s.pct - gap)}" stroke-dashoffset="${-s.off}"/>`).join("");
  return `
  <div class="glass hero tilt rv" style="--i:0"><div class="glare"></div>
    ${orbHTML(ks)}
    ${deltaChip(total, totalPast)}
  </div>
  <div class="tiles">
    ${tile(1,"Views today","instagram",ig.views,"Instagram, all content")}
    ${tile(2,"Reach today","instagram",ig.reach,"Accounts reached on IG")}
    ${tile(3,"Recent views",null,views,"Latest posts, all platforms")}
    ${tile(4,"Recent likes",null,likes,"Latest posts, all platforms")}
  </div>
  <div class="sec-title rv" style="--i:5"><h2>Follower split</h2><small>tap a platform</small></div>
  <div class="glass share rv" style="--i:6">
    <div class="donut"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="15"/>${donut}</svg>
      <div class="mid" id="dmid"><b>${withF.length}</b><span>platforms</span></div></div>
    <div class="legend">${segs.map(s => `<button data-k="${s.k}"><i style="background:${C(s.k)}"></i><span>${META[s.k].label}</span><b>${s.pct<1?"<1":Math.round(s.pct)}%</b></button>`).join("")}</div>
  </div>
  ${fresh ? `<div class="sec-title rv" style="--i:7"><h2>Hot right now</h2><small>best post, last 48h</small></div>
  <a class="glass hot tilt shimmer rv" style="--i:8;--g:${G(fresh.k)}" href="${esc(fresh.url)}" target="_blank" rel="noopener"><div class="glare"></div>
    <span class="tag"><span class="fl">🔥</span> ${META[fresh.k].label}</span>
    <div class="tt">${esc(fresh.title) || "(no caption)"}</div>
    <div class="meta">${esc(fresh.kind||"post")} · ${when(fresh.ts)}</div>
    <div class="nums"><div><b>${fmt(fresh.views)}</b><span>views</span></div><div><b>${fmt(fresh.likes)}</b><span>likes</span></div><div><b>${fmt(fresh.comments)}</b><span>comments</span></div>${fresh.shares!=null?`<div><b>${fmt(fresh.shares)}</b><span>shares</span></div>`:""}</div>
  </a>` : ""}`;
}
function tile(i, label, k, val, sub){
  return `<div class="glass tile rv" style="--i:${i}"><div class="k">${k?`<i style="background:${G(k)}"></i>`:""}${label}</div><div class="v">${cnt("tile"+i, val)}</div><div class="s">${sub}</div></div>`;
}
function accountsPage(){
  return keys().map((k,i) => {
    const a = data.accounts[k], m = META[k], posts = a.posts || [];
    const views = posts.reduce((s,p)=>s+(p.views||0),0), likes = posts.reduce((s,p)=>s+(p.likes||0),0);
    const best = posts.filter(p=>p.views!=null).sort((x,y)=>y.views-x.views)[0];
    return `<div class="glass acct tilt rv ${open.has(k)?"open":""}" data-k="${k}" style="--i:${i};--g:${G(k)};--c:${C(k)}"><div class="glare"></div>
      <div class="band" data-toggle="${k}">
        <div class="logo">${ICON[k]}</div>
        <div class="who"><b>${m.label}${m.sub?` <span style="display:inline;color:var(--mute);font-weight:500;font-size:12px">${m.sub}</span>`:""}</b><span>${esc(a.name||"")}${best?` · best ${fmt(best.views)} views`:""}</span></div>
        <div class="fol"><b>${cnt("f-"+k, a.followers)}</b>${deltaChip(a.followers, past(k,86400))}</div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      ${sparkSVG(k)}
      ${a.error ? `<div class="err">⚠ Couldn't refresh: ${esc(a.error)}${a.stale?" (showing last numbers)":""}</div>` : ""}
      <div class="more"><div>
        <div class="trio"><div>Recent views<b>${fmt(views)}</b></div><div>Recent likes<b>${fmt(likes)}</b></div><div>${a.views_total!=null?"All-time views":"Posts"}<b>${fmt(a.views_total ?? a.posts_total ?? posts.length)}</b></div></div>
        <div class="plist">${posts.slice(0,10).map(p => `<a class="prow" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="t"><div>${esc(p.title)||"(no caption)"}</div><small>${esc(p.kind||"")} · ${when(p.ts)}</small></div><div class="v"><b>${fmt(p.views)}</b>♥ ${fmt(p.likes)} · 💬 ${fmt(p.comments)}</div></a>`).join("")}</div>
        ${a.url ? `<a class="openbtn" href="${esc(a.url)}" target="_blank" rel="noopener">Open ${m.label} ↗</a>` : ""}
      </div></div>
    </div>`;
  }).join("");
}
function sparkSVG(k){
  const s = series(k); if(s.length < 2) return "";
  const xs = s.map(p=>p[0]), ys = s.map(p=>p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => x1===x0 ? 0 : (x-x0)/(x1-x0)*300, Y = y => y1===y0 ? 30 : 50-(y-y0)/(y1-y0)*42;
  const d = s.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
  return `<div class="chart"><svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none"><defs><linearGradient id="sg-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C(k)}" stop-opacity=".35"/><stop offset="1" stop-color="${C(k)}" stop-opacity="0"/></linearGradient></defs>
    <path class="area" d="${d}L300,56L0,56Z" fill="url(#sg-${k})"/><path class="line" pathLength="1" d="${d}" stroke="${C(k)}" vector-effect="non-scaling-stroke"/></svg></div>`;
}
function topPage(){
  const ks = keys().filter(k => (data.accounts[k].posts||[]).length);
  if(filter !== "all" && !ks.includes(filter)) filter = "all";
  const posts = allPosts().filter(p => filter === "all" || p.k === filter).sort((a,b)=>score(b)-score(a)).slice(0,25);
  const max = Math.max(1, ...posts.map(score));
  const chips = `<div class="chips rv" style="--i:0"><button class="fchip ${filter==="all"?"on":""}" data-f="all">All</button>${ks.map(k => `<button class="fchip ${filter===k?"on":""}" data-f="${k}" style="${filter===k?`--g:${G(k)}`:""}"><i style="background:${C(k)}"></i>${META[k].label}</button>`).join("")}</div>`;
  return chips + `<div style="margin-top:10px">${posts.map((p,i) => `<a class="glass rank rv" style="--i:${Math.min(i+1,10)}" href="${esc(p.url)}" target="_blank" rel="noopener">
      <div class="no ${i<3?"m"+(i+1):""}">${i+1}</div>
      <div class="body"><div class="tt">${esc(p.title)||"(no caption)"}</div>
        <div class="sub"><i style="background:${C(p.k)}"></i>${META[p.k].label} · ${esc(p.kind||"post")} · ${when(p.ts)}</div>
        <div class="bar"><span style="background:${G(p.k)}" data-w="${(score(p)/max*100).toFixed(1)}"></span></div></div>
      <div class="vv"><b>${fmt(p.views ?? p.likes)}</b><small>${p.views!=null?"views":"likes"}</small></div></a>`).join("") || `<div class="glass empty">No posts yet</div>`}</div>`;
}
function growthPage(){
  const secs = {"24h":86400,"7d":7*86400,"30d":30*86400,"all":1e12}[range] || 7*86400, since = data.updated - secs;
  const ks = keys();
  const chips = `<div class="chips rv" style="--i:0">${["24h","7d","30d","all"].map(r => `<button class="fchip ${range===r?"on":""}" data-r="${r}">${r==="all"?"All time":r}</button>`).join("")}</div>`;
  const charts = ks.map((k,i) => {
    const s = series(k, since), a = data.accounts[k];
    const ch = s.length > 1 ? s[s.length-1][1] - s[0][1] : null;
    return `<div class="glass gcard rv" style="--i:${i+1};--g:${G(k)}">
      <div class="ghead"><div class="dot">${ICON[k]}</div><b>${META[k].label}</b>
        <div class="ch"><strong style="color:${ch>0?"var(--up)":ch<0?"var(--down)":"var(--text)"}">${ch==null?"–":(ch>0?"+":"")+fmt(ch)}</strong>followers · ${range==="all"?"all time":range}</div></div>
      ${s.length > 1 ? `<div class="chart" data-k="${k}" data-since="${since}">${areaSVG(k, s)}<div class="xhair"></div><div class="xdot" style="background:${C(k)}"></div><div class="tip"></div></div>`
                     : `<div class="empty">📈 Collecting data<br>charts fill in as the stats refresh</div>`}
    </div>`;
  }).join("");
  const miles = ks.filter(k => data.accounts[k].followers != null).map((k,i) => {
    const f = data.accounts[k].followers, m = milestone(f), p = pace(k);
    const eta = p > 0 ? Math.ceil((m.next - f) / p) : null;
    const goal = k === "wezla" && f < 1000 ? "YouTube monetisation at 1K" : `${fmt(m.next - f)} to go`;
    return `<div class="glass mile tilt rv" style="--i:${i+ks.length+2}"><div class="glare"></div>
      <div class="mring"><svg viewBox="0 0 100 100"><defs><linearGradient id="mg-${k}"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="${C(k)}"/></linearGradient></defs>
        <circle class="trk" cx="50" cy="50" r="40"/><circle class="val" cx="50" cy="50" r="40" pathLength="100" stroke="url(#mg-${k})" style="stroke:${C(k)}" data-p="${(m.pct*100).toFixed(1)}"/></svg>
        <div class="pc">${Math.floor(m.pct*100)}%</div></div>
      <b>${META[k].label} → ${fmt(m.next)}</b><small>${goal}</small><small>${eta!=null ? (eta<1?"any moment now":`~${eta} day${eta===1?"":"s"} at this pace`) : "pace after a day of data"}</small></div>`;
  }).join("");
  return chips + `<div style="margin-top:10px">${charts}</div><div class="sec-title rv" style="--i:${ks.length+1}"><h2>Next milestones</h2><small>progress to the next big number</small></div><div class="miles">${miles}</div>`;
}
function areaSVG(k, s){
  const W = 320, H = 110, xs = s.map(p=>p[0]), ys = s.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if(y1 === y0){ y0 -= 1; y1 += 1; } const pad = (y1 - y0) * .12; y0 -= pad; y1 += pad;
  const X = x => (x - x0) / (x1 - x0 || 1) * W, Y = y => H - (y - y0) / (y1 - y0) * H;
  const d = s.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
  const grid = [0,.5,1].map(f => `<line x1="0" x2="${W}" y1="${(H*f).toFixed(1)}" y2="${(H*f).toFixed(1)}"/>`).join("");
  const lbl = t => new Date(t*1000).toLocaleString("en-GB", (x1-x0) > 2*86400 ? {day:"numeric",month:"short"} : {hour:"2-digit",minute:"2-digit"});
  return `<svg viewBox="0 0 ${W} ${H+18}" preserveAspectRatio="none"><defs><linearGradient id="ag-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C(k)}" stop-opacity=".45"/><stop offset="1" stop-color="${C(k)}" stop-opacity="0"/></linearGradient></defs>
    <g class="grid">${grid}</g><path class="area" d="${d}L${W},${H}L0,${H}Z" fill="url(#ag-${k})"/>
    <path class="line" pathLength="1" d="${d}" stroke="${C(k)}" vector-effect="non-scaling-stroke"/>
    <text class="ax" x="0" y="${H+14}">${lbl(x0)}</text><text class="ax" x="${W}" y="${H+14}" text-anchor="end">${lbl(x1)}</text></svg>`;
}

/* ---------- render + motion ---------- */
let firstPaint = true;
function render(){
  $("lock").classList.add("hide"); $("app").classList.remove("hide");
  $("upd").textContent = "Live · updated " + ago(data.updated); $("live").classList.toggle("stale", Date.now()/1000 - data.updated > 20*60);
  const h = new Date().getHours(); $("hello").textContent = (h<5?"Up late":h<12?"Good morning":h<18?"Good afternoon":"Good evening") + ", wslyy 👋";
  $("p-home").innerHTML = homePage(); $("p-accounts").innerHTML = accountsPage(); $("p-top").innerHTML = topPage(); $("p-growth").innerHTML = growthPage();
  if(!firstPaint) document.body.classList.add("settled");
  showTab(tab, false); firstPaint = false; wire();
}
function animatePage(id){
  const page = $("p-" + id);
  page.querySelectorAll("[data-c]").forEach(el => {
    const to = el.dataset.v === "" ? null : +el.dataset.v, key = el.dataset.c, f = el.dataset.f === "full" ? full : fmt;
    if(to == null){ el.textContent = "–"; return; }
    const from = shown[key] ?? (firstPaint || !document.body.classList.contains("settled") ? 0 : to);
    shown[key] = to;
    if(reduce || from === to){ el.textContent = f(to); return; }
    const t0 = performance.now(), dur = 1400;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4); el.textContent = f(from + (to - from) * e); if(p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    page.querySelectorAll("circle.seg").forEach(c => c.setAttribute("stroke-dasharray", c.dataset.d));
    page.querySelectorAll(".bar span").forEach(b => b.style.width = b.dataset.w + "%");
    page.querySelectorAll(".mring .val").forEach(c => c.style.strokeDasharray = c.dataset.p + " 100");
  }));
}
function showTab(id, user = true){
  const prev = tab; tab = id; store.set("stats_tab", id);
  TABS.forEach(t => { $("p-" + t).classList.toggle("active", t === id); $("p-" + t).classList.toggle("from-left", TABS.indexOf(id) < TABS.indexOf(prev)); });
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  $("pill").style.transform = `translateX(${TABS.indexOf(id) * 100}%)`;
  const [a,b] = TITLES[id]; $("ptitle").innerHTML = `${a} <span>${b}</span>`;
  if(user){ document.body.classList.remove("settled"); window.scrollTo({top:0, behavior: reduce ? "auto" : "smooth"}); }
  animatePage(id);
}

function wire(){
  document.querySelectorAll("[data-toggle]").forEach(el => el.onclick = () => {
    const card = el.closest(".acct"), k = card.dataset.k; card.classList.toggle("open");
    card.classList.contains("open") ? open.add(k) : open.delete(k); store.set("stats_open", JSON.stringify([...open]));
  });
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; store.set("stats_filter", filter); $("p-top").innerHTML = topPage(); document.body.classList.remove("settled"); animatePage("top"); wire(); });
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { range = b.dataset.r; store.set("stats_range", range); $("p-growth").innerHTML = growthPage(); document.body.classList.remove("settled"); animatePage("growth"); wire(); });
  document.querySelectorAll(".legend button").forEach(b => b.onclick = () => {
    const k = b.dataset.k, a = data.accounts[k], segs = document.querySelectorAll("circle.seg");
    const on = !b.classList.contains("sel"); document.querySelectorAll(".legend button").forEach(x => x.classList.remove("sel"));
    segs.forEach(c => { c.classList.toggle("hi", on && c.dataset.k === k); c.style.opacity = on && c.dataset.k !== k ? .35 : 1; });
    if(on){ b.classList.add("sel"); $("dmid").innerHTML = `<b>${fmt(a.followers)}</b><span>${META[k].label}</span>`; }
    else $("dmid").innerHTML = `<b>${segs.length}</b><span>platforms</span>`;
  });
  document.querySelectorAll(".tilt").forEach(tiltify);
  document.querySelectorAll(".chart[data-since]").forEach(scrubify);
}
function tiltify(el){
  if(reduce || el._t) return; el._t = 1;
  const move = e => {
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    el.classList.add("active"); el.style.transform = `perspective(900px) rotateX(${(0.5 - y) * 10}deg) rotateY(${(x - 0.5) * 12}deg) scale(1.015)`;
    el.style.setProperty("--gx", x * 100 + "%"); el.style.setProperty("--gy", y * 100 + "%");
  };
  const reset = () => { el.classList.remove("active"); el.style.transform = ""; };
  el.addEventListener("pointermove", move); el.addEventListener("pointerdown", move);
  el.addEventListener("pointerleave", reset); el.addEventListener("pointerup", reset); el.addEventListener("pointercancel", reset);
}
function scrubify(ch){
  const k = ch.dataset.k, s = series(k, +ch.dataset.since); if(s.length < 2) return;
  const svg = ch.querySelector("svg"), xs = s.map(p=>p[0]), ys = s.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if(y1 === y0){ y0 -= 1; y1 += 1; } const pad = (y1 - y0) * .12; y0 -= pad; y1 += pad;
  const show = e => {
    const r = svg.getBoundingClientRect(), fx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), t = x0 + fx * (x1 - x0);
    let best = s[0]; for(const p of s) if(Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const px = (best[0] - x0) / (x1 - x0 || 1) * r.width, py = (1 - (best[1] - y0) / (y1 - y0)) * (r.height * 110 / 128);
    ch.classList.add("scrub");
    ch.querySelector(".xhair").style.left = px + "px"; const dot = ch.querySelector(".xdot"); dot.style.left = px + "px"; dot.style.top = py + "px";
    const tip = ch.querySelector(".tip"); tip.style.left = Math.max(50, Math.min(r.width - 50, px)) + "px";
    tip.innerHTML = `<b>${full(best[1])}</b> · ${new Date(best[0]*1000).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"})}`;
  };
  ch.addEventListener("pointermove", show); ch.addEventListener("pointerdown", show);
  ch.addEventListener("pointerleave", () => ch.classList.remove("scrub")); ch.addEventListener("pointerup", () => setTimeout(() => ch.classList.remove("scrub"), 1200));
}

/* swipe between tabs */
let sx = 0, sy = 0, st = 0;
$("main").addEventListener("touchstart", e => { if(e.target.closest(".chart,.chips")) { st = 0; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, {passive:true});
$("main").addEventListener("touchend", e => {
  if(!st) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Date.now() - st < 600 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8){
    const i = TABS.indexOf(tab) + (dx < 0 ? 1 : -1); if(i >= 0 && i < TABS.length) showTab(TABS[i]);
  }
}, {passive:true});
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { if(b.dataset.tab !== tab) showTab(b.dataset.tab); });

/* starfield */
(function stars(){
  const cv = $("stars"), cx = cv.getContext("2d"); let W, H, pts = [];
  const size = () => { const d = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
    pts = Array.from({length: 46}, () => ({x: Math.random()*W, y: Math.random()*H, r: (Math.random()*1.4 + .4) * d, v: (Math.random()*.25 + .06) * d, a: Math.random()*Math.PI*2})); };
  size(); addEventListener("resize", size);
  const tick = () => { if(!document.hidden){ cx.clearRect(0,0,W,H);
    for(const p of pts){ p.y -= p.v; p.a += .02; if(p.y < -5){ p.y = H + 5; p.x = Math.random()*W; }
      cx.globalAlpha = .25 + Math.sin(p.a) * .2; cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill(); } }
    if(!reduce) requestAnimationFrame(tick); };
  tick();
})();

function showLock(msg, shake){
  $("app").classList.add("hide"); $("lock").classList.remove("hide"); $("lockerr").textContent = msg || "";
  if(shake){ $("lock").classList.remove("shake"); void $("lock").offsetWidth; $("lock").classList.add("shake"); }
  $("pw").focus();
}
$("go").onclick = () => { const v = $("pw").value.trim().toLowerCase(); if(!v) return; pass = v; $("lockerr").textContent = "Unlocking…"; load(); };
$("pw").onkeydown = e => { if(e.key === "Enter") $("go").click(); };
$("ref").onclick = load;
document.addEventListener("visibilitychange", () => { if(!document.hidden && pass) load(); });
setInterval(() => { if(!document.hidden && pass) load(); }, 60000);

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // when a newer version of the app takes over, reload once to show it
  let reloaded = false; const hadOne = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadOne && !reloaded){ reloaded = true; location.reload(); } });
}
if(!pass) showLock();
else { try{ data = JSON.parse(store.get("stats_cache") || "null"); }catch(e){} if(data) render(); load(); }
</script>
