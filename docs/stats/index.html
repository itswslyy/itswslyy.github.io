<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Stats">
<meta name="theme-color" content="#0b0d12">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>My Stats</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1c212c;--line:#262c39;--text:#f2f4f8;--dim:#8b93a5;--up:#3ddc84;--down:#ff6b6b;
--ig:#e1306c;--yt:#ff3b30;--wz:#ff9f0a;--fb:#1877f2;--th:#c8ccd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:13px}
button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.hero{background:linear-gradient(135deg,#1d2433,#151922);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
.mini{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
.dot{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.meta{flex:1;min-width:0}
.meta .n{font-weight:600}
.meta .h{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right}
.num b{font-size:22px;font-variant-numeric:tabular-nums}
.d{font-size:13px;font-variant-numeric:tabular-nums}
.d.up{color:var(--up)}.d.down{color:var(--down)}.d.flat{color:var(--dim)}
svg.spark{display:block;width:100%;height:46px}
.body{display:none;border-top:1px solid var(--line);padding:6px 14px 12px}
.card.open .body{display:block}
.stats3{display:flex;gap:8px;margin:8px 0}
.stats3 div{flex:1;background:var(--card2);border-radius:10px;padding:8px;font-size:12px;color:var(--dim)}
.stats3 b{display:block;color:var(--text);font-size:16px}
.post{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.post:last-child{border-bottom:0}
.post .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .t small{display:block;color:var(--dim);font-size:12px}
.post .v{text-align:right;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.post .v b{color:var(--text);font-size:15px}
.err{color:var(--down);font-size:12px;padding:0 14px 10px}
#lock{display:flex;flex-direction:column;gap:12px;margin-top:20vh}
#lock input{font:inherit;font-size:17px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text)}
#lock button{padding:14px;background:var(--fb);border:0;font-weight:600}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div id="lock" class="hide">
    <h1>My Stats</h1>
    <div class="sub">Enter your stats passphrase. It's only stored on this phone.</div>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passphrase">
    <button id="go">Unlock</button>
    <div id="lockerr" class="err" style="padding:0"></div>
  </div>
  <div id="app" class="hide">
    <header>
      <div><h1>My Stats</h1><div class="sub" id="upd">Loading…</div></div>
      <button id="ref" aria-label="Refresh">↻</button>
    </header>
    <div class="hero">
      <div class="sub">Total followers</div>
      <div class="big" id="total">–</div>
      <div class="d" id="totald"></div>
      <svg class="spark" id="totalspark" viewBox="0 0 300 46" preserveAspectRatio="none"></svg>
    </div>
    <div class="row" style="margin-bottom:14px">
      <div class="mini"><span class="sub">IG views today</span><b id="igv">–</b></div>
      <div class="mini"><span class="sub">IG reach today</span><b id="igr">–</b></div>
    </div>
    <div id="cards"></div>
    <div class="sub" style="text-align:center;margin-top:16px">Refreshes about every 15 minutes · tap a card for posts</div>
  </div>
</div>
<script>
const RAW = "https://raw.githubusercontent.com/itswslyy/itswslyy.github.io/stats-data/stats.enc";
const SRC = location.hostname.endsWith("github.io") ? RAW : "stats.enc";
const META = {
  instagram:{label:"Instagram",ch:"IG",c:"var(--ig)"},
  wezla:{label:"YouTube · wezla",ch:"W",c:"var(--wz)"},
  youtube:{label:"YouTube · relatable",ch:"YT",c:"var(--yt)"},
  facebook:{label:"Facebook",ch:"f",c:"var(--fb)"},
  threads:{label:"Threads",ch:"@",c:"#3a3f4b"}
};
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
// The passphrase is also kept in the link's #fragment (never sent to any server), because iPhone home-screen
// apps can lose saved storage between launches. Adding to Home Screen after unlocking bakes it into the icon.
const fromHash = new URLSearchParams(location.hash.slice(1)).get("k");
let pass = fromHash || store.get("stats_pass"), data = null, open = new Set(JSON.parse(store.get("stats_open")||"[]"));

const fmt = n => n==null ? "–" : n>=1e6 ? (n/1e6).toFixed(n>=1e7?1:2).replace(/\.0+$/,"")+"M" : n>=1e4 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"K" : n.toLocaleString("en-GB");
const ago = t => { const s=Date.now()/1000-t; return s<90?"just now":s<3600?Math.round(s/60)+" min ago":s<86400?Math.round(s/3600)+" h ago":Math.round(s/86400)+" d ago"; };
const when = iso => iso ? ago(Date.parse(iso)/1000) : "";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(box, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(box.salt), iterations:box.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(box.iv)}, key, b64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function load(){
  $("upd").textContent = "Refreshing…";
  try{
    const r = await fetch(SRC + "?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    data = await decrypt(await r.json(), pass);
    store.set("stats_pass", pass);
    if(new URLSearchParams(location.hash.slice(1)).get("k") !== pass) history.replaceState(null, "", "#k=" + encodeURIComponent(pass));
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
    store.set("stats_cache", JSON.stringify(data));
    render();
  }catch(e){
    if(e.name === "OperationError"){ store.del("stats_pass"); pass=null; history.replaceState(null, "", location.pathname); showLock("That passphrase didn't work. Check it matches STATS_KEY exactly."); return; }
    if(!data){ showLock(/404/.test(e.message) ? "No stats published yet. The first refresh on GitHub hasn't run – try again in a few minutes."
                                              : "Couldn't load stats (" + e.message + "). Check your signal and try again."); return; }
    $("upd").textContent = "Offline – showing last saved" + (data ? " (" + ago(data.updated) + ")" : "");
  }
}

// value for account k nearest to (now - secs) in history
function past(k, secs, field="f"){
  if(!data) return null; const target = data.updated - secs; let best=null;
  for(const [t,s] of data.history){ if(t<=target && s[k] && s[k][field]!=null) best=s[k][field]; }
  return best;
}
function delta(now, then){
  if(now==null || then==null) return '<span class="d flat">no change data yet</span>';
  const d = now-then, cls = d>0?"up":d<0?"down":"flat";
  return `<span class="d ${cls}">${d>0?"+":""}${fmt(d)} in 24h</span>`;
}
function spark(svg, pts, color){
  svg.style.display = pts.length < 2 ? "none" : "";
  if(pts.length < 2){ svg.innerHTML=""; return; }
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const X=x=>(x1===x0?0:(x-x0)/(x1-x0)*300), Y=y=>(y1===y0?23:42-(y-y0)/(y1-y0)*38);
  const d = pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join("");
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
}
const series = k => data.history.filter(h=>h[1][k] && h[1][k].f!=null).map(h=>[h[0],h[1][k].f]);

function render(){
  $("lock").classList.add("hide"); $("app").classList.remove("hide");
  $("upd").textContent = "Updated " + ago(data.updated);
  const A = data.accounts, keys = Object.keys(META).filter(k=>A[k] && (A[k].followers!=null || A[k].error));
  const total = keys.reduce((s,k)=>s+(A[k].followers||0),0);
  $("total").textContent = total.toLocaleString("en-GB");
  const tp = keys.reduce((s,k)=>{const v=past(k,86400); return v==null?s:s+v;},0);
  $("totald").innerHTML = delta(total, data.history[0][0] <= data.updated-86400 ? tp : null);
  const tot = data.history.map(h=>[h[0], keys.reduce((s,k)=>s+((h[1][k]||{}).f||0),0)]).filter(p=>p[1]>0);
  spark($("totalspark"), tot, "var(--up)");
  const t = (A.instagram||{}).today||{};
  $("igv").textContent = fmt(t.views); $("igr").textContent = fmt(t.reach);

  $("cards").innerHTML = keys.map(k=>{
    const a=A[k], m=META[k], posts=a.posts||[];
    const views = posts.reduce((s,p)=>s+(p.views||0),0), likes = posts.reduce((s,p)=>s+(p.likes||0),0);
    const best = posts.filter(p=>p.views!=null).sort((x,y)=>y.views-x.views)[0];
    return `<div class="card ${open.has(k)?"open":""}" data-k="${k}">
      <div class="top"><div class="dot" style="background:${m.c}">${m.ch}</div>
        <div class="meta"><div class="n">${m.label}</div><div class="h">${esc(a.name)}${best?" · best: "+fmt(best.views)+" views":""}</div></div>
        <div class="num"><b>${fmt(a.followers)}</b><br>${delta(a.followers, past(k,86400))}</div></div>
      <svg class="spark" viewBox="0 0 300 46" preserveAspectRatio="none" data-s="${k}"></svg>
      ${a.error?`<div class="err">Couldn't refresh: ${esc(a.error)}${a.stale?" (showing last numbers)":""}</div>`:""}
      <div class="body">
        <div class="stats3"><div>Recent views<b>${fmt(views)}</b></div><div>Recent likes<b>${fmt(likes)}</b></div>
          <div>${a.views_total!=null?"All-time views":"Posts"}<b>${fmt(a.views_total ?? a.posts_total ?? posts.length)}</b></div></div>
        ${posts.slice(0,12).map(p=>`<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">
          <div class="t">${esc(p.title)||"(no caption)"}<small>${p.kind||""} · ${when(p.ts)}</small></div>
          <div class="v"><b>${fmt(p.views)}</b> views<br>♥ ${fmt(p.likes)} · 💬 ${fmt(p.comments)}</div></a>`).join("")}
        ${a.url?`<a class="post" href="${esc(a.url)}" target="_blank" rel="noopener"><div class="t" style="color:${m.c}">Open ${m.label} →</div></a>`:""}
      </div></div>`;
  }).join("");
  document.querySelectorAll("svg[data-s]").forEach(s=>spark(s, series(s.dataset.s), META[s.dataset.s].c));
  document.querySelectorAll(".card .top").forEach(el=>el.onclick=()=>{
    const c=el.parentElement, k=c.dataset.k; c.classList.toggle("open");
    c.classList.contains("open")?open.add(k):open.delete(k); store.set("stats_open", JSON.stringify([...open]));
  });
}

function showLock(msg){ $("app").classList.add("hide"); $("lock").classList.remove("hide"); $("lockerr").textContent = msg||""; $("pw").focus(); }
$("go").onclick = () => { const v=$("pw").value.trim().toLowerCase(); if(!v) return; pass=v; $("lockerr").textContent="Unlocking…"; store.set("stats_pass", v); load(); };
$("pw").onkeydown = e => { if(e.key==="Enter") $("go").click(); };
$("ref").onclick = load;
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && pass) load(); });
setInterval(()=>{ if(!document.hidden && pass) load(); }, 120000);

if(!pass) showLock();
else { try{ data = JSON.parse(store.get("stats_cache")||"null"); }catch(e){} if(data) render(); load(); }
</script>
</body>
</html>
